name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and assemble publication artifacts
        run: >-
          ./gradlew test jar sourcesJar remapJar remapSourcesJar
          :core:generatePomFileForDisplayKitCorePublication
          :pack:generatePomFileForDisplayKitPackPublication
          :fabric:generatePomFileForDisplayKitFabricPublication
